[profile.dev]
incremental = true
panic = "unwind"

[profile.release]
incremental = true
lto = "fat"
opt-level = 3
codegen-units = 1
panic = "abort"

[workspace]
resolver = "3"
members = [
    "framework",
    "md/*",
    "util",
]

[workspace.dependencies]
zerocopy = { version = "0.8.27", features = ["derive"]}
